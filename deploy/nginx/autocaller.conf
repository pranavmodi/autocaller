server {
    if ($host = autocaller.getpossibleminds.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = possibleos.getpossibleminds.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name autocaller.getpossibleminds.com possibleos.getpossibleminds.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Common upstream blocks
upstream autocaller_api {
    server 127.0.0.1:8099;
}

upstream autocaller_ui {
    server 127.0.0.1:3099;
}

server {
    listen 443 ssl http2;
    server_name autocaller.getpossibleminds.com possibleos.getpossibleminds.com;

    ssl_certificate /etc/letsencrypt/live/autocaller.getpossibleminds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autocaller.getpossibleminds.com/privkey.pem;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 25m;

    # ---- Daemon: REST API + Twilio webhooks + WebSockets ----
    location /api/ {
        proxy_pass http://autocaller_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /ws/ {
        proxy_pass http://autocaller_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /health {
        proxy_pass http://autocaller_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /audio/ {
        proxy_pass http://autocaller_api;
    }

    # ---- Outreach tracking: open pixel + click redirect (public, no auth) ----
    location /t/ {
        proxy_pass http://autocaller_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Tracked-link redirect endpoints -> backend (no auth) ----
    location /v/ {
        proxy_pass http://autocaller_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /a/ {
        proxy_pass http://autocaller_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /aiaudit/go {
        proxy_pass http://autocaller_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Public returned-data receiver ----
    location = /datareturned {
        proxy_pass http://autocaller_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Allow crawlers to observe noindex on previously indexed login variants.
    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # ---- Frontend: everything else → Next.js ----
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://autocaller_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow Next's HMR + static
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
